<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; img-src 'self' data:">
  <title>BMMS Central</title>
  <link rel="stylesheet" href="hub.css">
</head>
<body>
  <nav class="side" aria-label="Secciones">
    <div class="side-logo" title="BMMS Central">B</div>
    <button class="side-item is-active" id="navApps" title="Instalar y actualizar aplicaciones">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0-4-4m4 4 4-4M5 17v3h14v-3" /></svg>
      <span>Instalar apps</span>
    </button>
    <button class="side-item" id="navOffline" title="Instalar desde una carpeta o pendrive, sin internet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z" /><path d="M12 12v5m0 0-2-2m2 2 2-2" /></svg>
      <span>Sin conexión</span>
    </button>
    <button class="side-item" id="navData" title="Abrir la carpeta con tus ajustes y sesiones">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3" /><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3" /></svg>
      <span>Mis datos</span>
    </button>
    <div class="side-spacer"></div>
    <div class="side-version" id="centralVersion"></div>
  </nav>

  <div class="main">
    <header class="top">
      <h1>Instalar y actualizar aplicaciones</h1>
      <div class="top-tools">
        <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" /><path d="m20 20-4.5-4.5" /></svg><input id="search" type="search" placeholder="Buscar" aria-label="Buscar aplicaciones"></label>
        <button class="pill-updates" id="updatesPill" hidden>Actualizaciones disponibles</button>
        <button class="icon-button" id="refresh" title="Buscar actualizaciones" aria-label="Buscar actualizaciones"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" /></svg></button>
      </div>
    </header>

    <div class="notice" id="notice" hidden></div>
    <div class="update-banner" id="updateBanner" hidden>
      <div><strong id="updateTitle"></strong><span id="updateList"></span></div>
      <button class="pill-small" id="updateAll">Actualizar todo</button>
    </div>

    <div class="tabs" role="tablist">
      <button role="tab" class="tab" data-tab="mine">Mis apps</button>
      <button role="tab" class="tab is-active" data-tab="all">Todas las apps</button>
      <span class="tabs-status" id="channel"></span>
    </div>

    <div class="table">
      <div class="thead">
        <span></span>
        <span>Aplicación</span>
        <span>Categoría</span>
        <span class="center">Instalada</span>
        <span class="center">Al día</span>
      </div>
      <div class="tbody" id="rows"></div>
    </div>

    <footer class="foot">
      <span>Otras opciones:</span>
      <button class="link" id="footFolder">Instalar desde carpeta</button>
      <span class="sep">|</span>
      <button class="link" id="footData">Carpeta de datos</button>
      <span class="sep" id="footUiSep" hidden>|</span>
      <button class="link" id="footUiBack" hidden>Volver al diseño anterior</button>
    </footer>
  </div>

  <aside class="panel" aria-label="Apps seleccionadas">
    <h2>Apps seleccionadas</h2>
    <p class="panel-hint" id="panelHint"></p>
    <div class="summary" id="summary"></div>
    <div class="progress" id="progress" hidden>
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      <span id="progressLabel"></span>
    </div>
    <p class="message" id="message" hidden></p>
    <div class="panel-links" id="panelLinks"></div>
    <div class="panel-spacer"></div>
    <div class="self-update" id="selfUpdate" hidden></div>
    <button class="pill-primary" id="primary">Instalar</button>
  </aside>

  <script src="hub.js"></script>
</body>
</html>
